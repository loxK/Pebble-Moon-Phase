name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the tag against package.json
        run: |
          version="$(jq -r .version package.json)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but package.json says $version"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: watchapp

      - name: Checksum
        run: |
          # A fixed name keeps releases/latest/download/moon-phase.pbw pointing at the newest.
          mv Pebble-Moon-Phase.pbw moon-phase.pbw
          sha256sum moon-phase.pbw > moon-phase.pbw.sha256
          cat moon-phase.pbw.sha256

      - name: Release notes from the changelog
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            index($0, "## " version) == 1 { found = 1; next }
            /^## / { found = 0 }
            found
          ' CHANGELOG.md > changes.md
          if [ ! -s changes.md ]; then
            echo "::error::No section for ${GITHUB_REF_NAME#v} in CHANGELOG.md"
            exit 1
          fi
          {
            echo "**Get it on the [Pebble App Store](https://apps.repebble.com/86a2d34ade9646dfb84d51af)**, or sideload the \`.pbw\` below."
            echo
            echo "**Latest download:** <https://github.com/$GITHUB_REPOSITORY/releases/latest/download/moon-phase.pbw>"
            cat changes.md
            echo "**SHA-256**"
            echo '```'
            cat moon-phase.pbw.sha256
            echo '```'
          } > notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: moon-phase.pbw

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" moon-phase.pbw moon-phase.pbw.sha256 \
            --title "Moon Phase $GITHUB_REF_NAME" --notes-file notes.md
