name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  PEBBLE_SDK: "4.44"

jobs:
  watchapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # pebble-tool prepares the SDK's virtual environment with uv.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install the Pebble tool
        run: pip install --upgrade pebble-tool

      - name: Cache the Pebble SDK
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pebble-sdk
          key: pebble-sdk-${{ env.PEBBLE_SDK }}

      - name: Install the Pebble SDK ${{ env.PEBBLE_SDK }}
        # `pebble sdk install` exits non-zero when the SDK is already there.
        run: |
          if [ -d "$HOME/.local/share/pebble-sdk/SDKs/$PEBBLE_SDK" ]; then
            echo "SDK $PEBBLE_SDK restored from cache"
          else
            pebble sdk install "$PEBBLE_SDK"
          fi

      - name: Test the phone-side engine
        run: node tests/engine.test.js

      - name: Test the plugin
        run: node tests/plugin.test.js

      - name: Build
        run: pebble build

      - uses: actions/upload-artifact@v7
        with:
          name: watchapp
          path: build/Pebble-Moon-Phase.pbw
